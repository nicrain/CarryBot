<!DOCTYPE html>
<html>
<head>
    <title>CarryBot Console</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 14px; }
        #container { width: 100%; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        #video-panel { width: 100%; }
        #control-panel { width: 100%; background: #333; padding: 14px; border-radius: 8px; text-align: left; }
        img { border: 2px solid #555; max-width: 100%; height: auto; }
        h1 { color: #0f0; font-size: 24px; margin-bottom: 5px; }
        h2 { color: #0f0; margin: 0 0 10px 0; font-size: 20px; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        /* Make params fit on one screen: multi-column, compact spacing */
        #params-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px 14px;
            align-items: end;
        }
        .param-group { margin: 0; }
        label { display: block; margin-bottom: 5px; color: #ddd; font-weight: bold; }
        .desc { font-size: 12px; color: #888; margin-bottom: 5px; font-style: italic; }
        input[type="number"], input[type="text"], select {
            width: calc(100% - 22px); padding: 8px; border: 1px solid #555; border-radius: 4px; background: #444; color: #fff;
        }
        button {
            background: #0f0; color: #000; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; font-weight: bold;
        }
        button:hover { background: #0c0; }
        #status-message { margin-top: 15px; font-weight: bold; text-align: center; min-height: 24px; }
        .success { color: #0f0; }
        .error { color: #f00; }

        /* Grid placement for the submit button and status */
        #params-form button,
        #status-message {
            grid-column: 1 / -1;
        }

        /* Small screens: keep things readable */
        @media (max-width: 720px) {
            body { padding: 10px; }
            #params-form { grid-template-columns: 1fr; }
        }

        .control-section {
            width: 100%;
            background: #333;
            padding: 14px;
            border-radius: 8px;
            text-align: left;
        }
        .motor-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 14px;
            align-items: start;
        }
        .motor-card {
            background: #222;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 12px;
        }
        .card-title {
            margin: 0 0 10px 0;
            color: #aaa;
            font-weight: bold;
            font-size: 14px;
        }

        /* Motor buttons: scoped styles (do not change the Params submit button) */
        .control-section .m-btn {
            margin: 0;
            width: auto;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid #555;
            background: #444;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
        }
        .control-section .m-btn:hover { background: #0c0; color: #000; }
        .control-section .m-btn:active { transform: translateY(1px); }
        .control-section .m-btn.stop {
            background: #0f0;
            color: #000;
            border-color: #0c0;
        }
        .control-section .m-btn.stop:hover { background: #0c0; }
        .control-section .m-btn.icon {
            width: 74px;
            height: 74px;
            display: grid;
            place-items: center;
            padding: 0;
            font-size: 24px;
        }
        .control-section .m-btn.wide {
            width: 100%;
        }

        /* D-pad layout */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 74px);
            grid-template-rows: repeat(3, 74px);
            gap: 10px;
            justify-content: center;
        }
        .dpad .up { grid-column: 2; grid-row: 1; }
        .dpad .left { grid-column: 1; grid-row: 2; }
        .dpad .stop { grid-column: 2; grid-row: 2; }
        .dpad .right { grid-column: 3; grid-row: 2; }
        .dpad .down { grid-column: 2; grid-row: 3; }

        /* Climb controls */
        .climb-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .climb-grid.three {
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 900px) {
            .motor-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 420px) {
            .control-section .m-btn.icon { width: 64px; height: 64px; }
            .dpad { grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 8px; }
        }
        #motor-status {
            margin: 0;
            min-height: 18px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Surveillance et Contrôle en Temps Réel</h1>

    <div id="container">
        <div id="video-panel">
            <img src="/video_feed" />
        </div>
        <div id="control-panel">
            <h2>Paramètres</h2>
            <form id="params-form">
                <!-- FORM_PLACEHOLDER -->
                <button type="submit">Mettre à jour</button>
                <div id="status-message"></div>
            </form>
        </div>
        <div class="control-section">
          <h2>Motor Control</h2>
                    <div class="motor-grid">
                        <div class="motor-card">
                            <p class="card-title">Drive (D-pad)</p>
                            <div class="dpad">
                                <button class="m-btn icon up" type="button" title="Forward" onclick="drive('forward')">▲</button>
                                <button class="m-btn icon left" type="button" title="Left" onclick="drive('left')">◀</button>
                                <button class="m-btn icon stop" type="button" title="Stop" onclick="stopAll()">■</button>
                                <button class="m-btn icon right" type="button" title="Right" onclick="drive('right')">▶</button>
                                <button class="m-btn icon down" type="button" title="Backward" onclick="drive('backward')">▼</button>
                            </div>
                        </div>

                        <div class="motor-card">
                            <p class="card-title">Climb</p>

                            <div class="climb-grid">
                                <button class="m-btn wide" type="button" onclick="drive('up')">Tristar ▲ Up</button>
                                <button class="m-btn wide" type="button" onclick="drive('down')">Tristar ▼ Down</button>
                            </div>

                            <div style="height: 10px;"></div>

                            <div class="climb-grid">
                                <button class="m-btn wide" type="button" onclick="drive('front_up')">Front ▲</button>
                                <button class="m-btn wide" type="button" onclick="drive('front_down')">Front ▼</button>
                                <button class="m-btn wide" type="button" onclick="drive('rear_up')">Rear ▲</button>
                                <button class="m-btn wide" type="button" onclick="drive('rear_down')">Rear ▼</button>
                            </div>
                        </div>
                    </div>

          <p id="motor-status" style="font-family: monospace;"></p>
        </div>
    </div>

    <script>
        document.getElementById('params-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const params = {};
            for (let [key, value] of formData.entries()) {
                if (!isNaN(parseFloat(value)) && isFinite(value)) {
                    params[key] = parseFloat(value);
                } else {
                    params[key] = value;
                }
            }

            const statusMessage = document.getElementById('status-message');
            statusMessage.className = '';
            statusMessage.textContent = 'Mise à jour en cours...';

            try {
                const response = await fetch('/params', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(params)
                });
                const data = await response.json();
                if (response.ok) {
                    statusMessage.textContent = 'Mise à jour réussie !';
                    statusMessage.className = 'success';
                } else {
                    statusMessage.textContent = 'Échec : ' + (data.message || 'Erreur inconnue');
                    statusMessage.className = 'error';
                }
            } catch (error) {
                statusMessage.textContent = 'Erreur de requête : ' + error.message;
                statusMessage.className = 'error';
            }
        });
        async function postJson(url, payload) {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload || {})
          });
          let data = null;
          try { data = await res.json(); } catch (e) {}
          return { ok: res.ok, status: res.status, data };
        }

        async function drive(action) {
          const r = await postJson('/drive', { action });
          const el = document.getElementById('motor-status');
          if (r.ok) {
            el.textContent = 'OK: ' + action;
          } else {
            const msg = (r.data && (r.data.message || r.data.status)) ? (r.data.message || r.data.status) : 'error';
            el.textContent = 'ERR(' + r.status + '): ' + msg;
          }
        }

        async function stopAll() {
          const r = await postJson('/stop', {});
          const el = document.getElementById('motor-status');
          el.textContent = r.ok ? 'OK: stop' : 'ERR(' + r.status + ')';
        }
    </script>
</body>
</html>
